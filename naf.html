<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NAF example</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/easyrtc/easyrtc.js"></script>
    <script src="https://unpkg.com/networked-aframe@^0.14.0/dist/networked-aframe.min.js"></script>
    <script>
       // see issue https://github.com/networked-aframe/networked-aframe/issues/267
       NAF.schemas.getComponentsOriginal = NAF.schemas.getComponents;
       NAF.schemas.getComponents = (template) => {
          if (!NAF.schemas.hasTemplate('#avatar-template')) {
             NAF.schemas.add({
                template: '#avatar-template',
                components: [
                   {
                      component: 'position',
                      requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.001)
                   },
                   {
                      component: 'rotation',
                      requiresNetworkUpdate: NAF.utils.vectorRequiresUpdate(0.5)
                   },
                   {
                      selector: '.head',
                      component: 'material',
                      property: 'color'
                   }
                ]
             });
          }
          const components = NAF.schemas.getComponentsOriginal(template);
          return components;
       };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-randomizer-components@3.0.2/dist/aframe-randomizer-components.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
</head>
<body>
<a-scene
        networked-scene="
      room: basic;
      debug: true;
      adapter: wseasyrtc;
    "
        renderer="physicallyCorrectLights: true;"
>
    <a-assets>
        <!-- Templates -->

        <!-- Avatar -->
        <template id="avatar-template">
            <a-entity class="avatar">
                <a-sphere class="head" scale="0.45 0.5 0.4"></a-sphere>
                <a-entity class="face" position="0 0.05 0">
                    <a-sphere class="eye" color="#efefef" position="0.16 0.1 -0.35" scale="0.12 0.12 0.12">
                        <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
                    </a-sphere>
                    <a-sphere class="eye" color="#efefef" position="-0.16 0.1 -0.35" scale="0.12 0.12 0.12">
                        <a-sphere class="pupil" color="#000" position="0 0 -1" scale="0.2 0.2 0.2"></a-sphere>
                    </a-sphere>
                </a-entity>
            </a-entity>
        </template>

        <!-- /Templates -->
    </a-assets>
    <a-entity id="cameraRig">
        <a-entity
                id="player"
                networked="template:#avatar-template;attachTemplateToLocal:false;"
                camera
                position="0 1.6 0"
                wasd-controls
                look-controls
        >
            <a-sphere class="head" visible="false" random-color></a-sphere>
        </a-entity>
    </a-entity>

    <!--       <a-entity environment="preset:tron"></a-entity>
          <a-entity light="type:ambient;intensity:1.0"></a-entity>
     -->
    <a-entity position="50 0 -10">
        <!--                           x   y   z-->
        <a-box id="first_box"
               color="white" position="0   0.5 0"></a-box>
        <a-box color="white" position="1.5 0.5 0"></a-box>
        <a-box color="yellow" position="3   0.5 0" width="3"></a-box> <!-- width=x -->

        <a-box color="green" position="0   0.5 1.5"></a-box>
        <a-box color="green" position="1.5 0.5 1.5"></a-box>
        <a-box color="brown" position="3   0.5 1.5" depth="3" scale="0.5 0.5 0.5"></a-box> <!-- depth=z -->


        <a-box color="cyan" position="0   2   0" height="3"></a-box> <!-- height=y -->
        <a-box color="red" position="1.5 2   0"></a-box>
        <a-box color="red" position="3   2   0"></a-box>

        <a-box color="red" position="0   2   1.5"></a-box>
        <a-box color="red" position="1.5 2   1.5"></a-box>
        <a-box color="red" position="3   2   1.5"></a-box>
    </a-entity>
</a-scene>
<script>
   // Called by Networked-Aframe when connected to server
   function onConnect() {
      console.log('onConnect', new Date());
   }
</script>
</body>
</html>

variables:
  PUBLIC_URL: "/ndmvr-core/" # slash is important
  IMAGE: node:22.11.0
image: ${IMAGE}

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - node_modules/

pages:
  stage: build
  tags:
    - gitlab-org-docker
  variables:
    GIT_DEPTH: 0
  script:
    - npm install
    - npm run build -- --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

buildzip:
  stage: build
  image: registry.gitlab.com/ndmspc/docs/ndmspc-doc
  tags:
    - ndmspc-hosted
  script:
    - dnf install -y zip
    - mkdocs build -d public/docs
    - mkdir public/docs/downloads
    - cd docs/components/tutorial
    - zip -r ../../../public/docs/downloads/first-visualization.zip three-scene.js h3scat.json firstVisualization/firstVisualization.html
    - zip -r ../../../public/docs/downloads/configuration.zip three-scene.js h3scat.json THnPainterManager.js configurationChapter/configuration-chapter.html configurationChapter/config.json
    - zip -r ../../../public/docs/downloads/interactions.zip three-scene.js test3.json THnPainterManager.js interactions/interactions.html interactions/config.json interactions/custom-functions.js
    - zip -r ../../../public/docs/downloads/canvas.zip three-scene.js h3scat.json test3.json THnPainterManager.js canvas/canvas.html canvas/config.json canvas/image.json canvas/image.png
  artifacts:
    paths:
      - public
  rules:
    - changes:
      - docs/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:
  stage: deploy
  image: ${IMAGE}
  tags:
    - gitlab-org-docker
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - "sed -i -e 's/^  \\\"version\\\".*/  \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    - npm install -g npm@latest
    - CI=true npm install
    - CI=true npm run build
    - export MY_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - if [ -z "$MY_VER_RELEASE" ];then CI=true npm publish --access public; fi
    - if [ -n "$MY_VER_RELEASE" ];then CI=true npm publish --access public --tag rc; fi
  only:
    - tags

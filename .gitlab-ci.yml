variables:
  PUBLIC_URL: "/ndmvr-aframe/" # slash is important

image: node:22.11.0

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - node_modules/

pages:
  stage: deploy
  script:
    - npm install
    - npm run build -- --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-npm:
  stage: deploy
  image: node:22.11.0
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - "sed -i -e 's/^  \\\"version\\\".*/  \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    - CI=true npm install
    - CI=true npm run build
    - CI=true npm publish --access public
  only:
    - tags
